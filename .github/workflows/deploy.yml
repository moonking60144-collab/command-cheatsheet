name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stamp cache version
        run: sed -i "s/__CACHE_BUSTER__/${{ github.sha }}/g" sw.js

      - name: Prepare deployment
        run: |
          mkdir _site
          cp index.html app.js utils.js search-core.js search.worker.js decrypt.worker.js sw.js _site/
          cp commands.json manifest.json _site/
          [ -f secure-categories.json ] && cp secure-categories.json _site/ || true
          cp -r assets _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
