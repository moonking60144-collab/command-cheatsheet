<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#79b8ff">
  <meta
    name="description"
    content="一個可搜尋、可分類、可離線使用的指令查詢工作台，適合部署到 GitHub Pages。"
  >
  <title>Command Atlas | 指令查詢工作台</title>
  <link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-grid">
        <div class="hero-copy">
          <p class="eyebrow">Command Atlas</p>
          <div class="hero-meta">
            <span class="meta-chip" id="command-count">0 筆指令</span>
            <span class="meta-chip" id="category-count">0 個分類</span>
          </div>
        </div>
        <span class="panel-label"><kbd>/</kbd> 聚焦搜尋</span>
      </div>

      <section class="hero-panel" aria-label="搜尋與篩選">
        <div class="panel-heading">
          <label class="search-panel" for="search-input">
            <span>搜尋指令、描述、標籤或分類</span>
            <input
              id="search-input"
              type="search"
              autocomplete="off"
              placeholder="搜尋指令、描述、標籤或分類…"
            >
          </label>
        </div>

        <div id="filter-bar" class="filter-bar" aria-label="分類篩選"></div>

        <div class="toolbar">
          <p id="active-state" class="active-state">目前：全部分類</p>
          <p id="result-summary" class="result-summary">正在載入指令資料...</p>
          <button id="clear-btn" class="ghost-button" type="button">清空</button>
        </div>
      </section>

      <section id="secure-panel" class="secure-panel" aria-label="受保護分類解鎖" hidden>
        <div class="secure-panel-header">
          <div>
            <p class="section-label">Protected</p>
            <p class="secure-panel-copy">指定分類資料已使用 AES-256 加密。密碼只存在目前頁面的記憶體中，不會寫入本機持久化儲存。</p>
          </div>
        </div>
        <div id="secure-category-list" class="secure-category-list"></div>
      </section>
    </header>

    <main class="layout">
      <section id="public-results-section" class="results-section" aria-labelledby="results-title">
        <div class="section-header">
          <div>
            <p class="section-label">Public</p>
            <h2 id="results-title">公開分類</h2>
          </div>
          <p class="section-caption">公開資料會直接顯示在這裡。</p>
        </div>

        <div id="results" class="card-grid" aria-live="polite"></div>
      </section>

      <section id="protected-results-section" class="results-section results-section-protected" aria-labelledby="protected-results-title" hidden>
        <div class="section-header">
          <div>
            <p class="section-label">Private</p>
            <h2 id="protected-results-title">私人分類</h2>
          </div>
          <p class="section-caption">解鎖後的私人分類會集中顯示在這一段。</p>
        </div>

        <div id="protected-results" class="card-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="footer">
      <p>Command Atlas · 純靜態 · GitHub Pages</p>
      <p>搜尋、複製、走人。</p>
    </footer>
  </div>

  <noscript>
    <div class="noscript-banner">這個網站需要啟用 JavaScript 才能使用搜尋、分類與複製功能。</div>
  </noscript>

  <div id="app-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" defer integrity="sha384-mgWScxWVKP8F7PBbpNp7i/aSb17kN0LcifBpahAplF3Mn0GR4/u1oMpWIm2rD8yY" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="app.js" defer></script>
</body>
</html>
