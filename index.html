<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#79b8ff">
  <meta
    name="description"
    content="一個可搜尋、可分類、可離線使用的指令查詢工作台，適合部署到 GitHub Pages。"
  >
  <title>Command Atlas | 指令查詢工作台</title>
  <link rel="icon" href="assets/icons/icon-192.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div class="hero-grid">
        <div class="hero-copy">
          <div class="brand">
            <span class="brand-monogram" aria-hidden="true">LJ</span>
            <p class="eyebrow"><span class="brand-word-dim">Command</span> <span class="brand-word-accent">Atlas</span></p>
          </div>
          <div class="hero-meta">
            <span class="meta-chip" id="command-count">0 筆指令</span>
            <span class="meta-chip" id="category-count">0 個分類</span>
          </div>
        </div>
        <div class="help-wrap">
          <button id="help-btn" class="help-btn" type="button" aria-label="鍵盤快捷鍵說明" aria-expanded="false">?</button>
          <div id="shortcuts-tooltip" class="shortcuts-tooltip" role="tooltip" aria-hidden="true">
            <p class="shortcuts-title">快捷鍵</p>
            <div class="shortcut-row">
              <span class="shortcut-keys"><kbd>/</kbd></span>
              <span class="shortcut-desc">聚焦搜尋</span>
            </div>
            <div class="shortcut-row">
              <span class="shortcut-keys"><kbd>Ctrl</kbd> <kbd>K</kbd></span>
              <span class="shortcut-desc">聚焦搜尋</span>
            </div>
            <div class="shortcut-row">
              <span class="shortcut-keys"><kbd>Esc</kbd></span>
              <span class="shortcut-desc">關閉選單 / 清除搜尋</span>
            </div>
            <div class="shortcut-row">
              <span class="shortcut-keys"><kbd>Enter</kbd></span>
              <span class="shortcut-desc">空白狀態聚焦搜尋</span>
            </div>
            <div class="shortcut-row">
              <span class="shortcut-keys"><kbd>Enter</kbd> <kbd>Space</kbd></span>
              <span class="shortcut-desc">卡片 focus 時複製指令</span>
            </div>
          </div>
        </div>
      </div>

      <section class="hero-panel" aria-label="搜尋與篩選">
        <div class="panel-heading">
          <label class="search-panel" for="search-input">
            <input
              id="search-input"
              class="search-input"
              type="search"
              autocomplete="off"
              aria-label="搜尋指令、描述、標籤或分類"
              placeholder="搜尋指令、描述、標籤或分類…"
            >
          </label>
        </div>

        <div class="filter-row">
          <div class="filter-bar-wrap">
            <div id="filter-bar" class="filter-bar" aria-label="分類篩選"></div>
          </div>
          <div class="picker-wrap">
            <button
              id="category-picker-btn"
              class="category-picker-btn"
              type="button"
              aria-label="所有分類"
              aria-expanded="false"
              title="所有分類"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <rect x="1" y="1" width="6" height="6" rx="1.2"></rect>
                <rect x="9" y="1" width="6" height="6" rx="1.2"></rect>
                <rect x="1" y="9" width="6" height="6" rx="1.2"></rect>
                <rect x="9" y="9" width="6" height="6" rx="1.2"></rect>
              </svg>
            </button>
            <div
              id="category-picker"
              class="category-picker"
              hidden
              role="dialog"
              aria-label="選擇分類"
            ></div>
          </div>
        </div>

        <div class="toolbar">
          <p id="active-state" class="active-state">目前：全部分類</p>
          <p id="result-summary" class="result-summary">正在載入指令資料...</p>
          <button id="view-toggle-btn" class="ghost-button view-toggle-btn" type="button" aria-pressed="false">緊湊</button>
          <button id="clear-btn" class="ghost-button" type="button" hidden>清空</button>
        </div>
      </section>

      <details id="secure-panel" class="secure-panel" aria-label="受保護分類解鎖" hidden>
        <summary class="secure-panel-toggle">
          <span class="section-label">私人指令庫</span>
          <span class="secure-panel-hint">輸入密碼解鎖，解鎖後顯示在結果區</span>
        </summary>
        <div id="secure-category-list" class="secure-category-list"></div>
      </details>
    </header>

    <div id="sticky-search-bar" class="sticky-search-bar" aria-hidden="true">
      <div class="sticky-search-shell">
        <label class="sticky-search-input-wrap" for="sticky-search-input">
          <input
            id="sticky-search-input"
            class="search-input search-input-sticky"
            type="search"
            autocomplete="off"
            aria-label="快速搜尋指令"
            placeholder="快速搜尋指令…"
          >
        </label>
        <span id="sticky-active-category" class="sticky-active-category">全部分類</span>
        <div class="picker-wrap picker-wrap-sticky">
          <button
            id="sticky-category-picker-btn"
            class="category-picker-btn category-picker-btn-sticky"
            type="button"
            aria-label="所有分類"
            aria-expanded="false"
            title="所有分類"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="1" y="1" width="6" height="6" rx="1.2"></rect>
              <rect x="9" y="1" width="6" height="6" rx="1.2"></rect>
              <rect x="1" y="9" width="6" height="6" rx="1.2"></rect>
              <rect x="9" y="9" width="6" height="6" rx="1.2"></rect>
            </svg>
          </button>
          <div
            id="sticky-category-picker"
            class="category-picker category-picker-sticky"
            hidden
            role="dialog"
            aria-label="選擇分類"
          ></div>
        </div>
        <button id="sticky-clear-btn" class="ghost-button sticky-clear-btn" type="button" hidden>清空</button>
      </div>
    </div>

    <main class="layout">
      <section id="public-results-section" class="results-section" aria-labelledby="results-title">
        <div class="section-header">
          <h2 id="results-title">公開分類</h2>
        </div>

        <div id="results" class="card-grid" aria-live="polite">
          <div class="skeleton-card" aria-hidden="true"></div>
          <div class="skeleton-card" aria-hidden="true"></div>
          <div class="skeleton-card" aria-hidden="true"></div>
        </div>
        <div id="public-pagination" class="pagination" hidden></div>
      </section>

      <section id="protected-results-section" class="results-section results-section-protected" aria-labelledby="protected-results-title" hidden>
        <div class="section-header">
          <h2 id="protected-results-title">私人分類</h2>
        </div>

        <div id="protected-results" class="card-grid" aria-live="polite"></div>
        <div id="protected-pagination" class="pagination" hidden></div>
      </section>
    </main>

    <footer class="footer">
      <p>僅供個人技術查詢參考，部分指令可能影響系統狀態，執行前請確認影響範圍。</p>
      <p>Command Cheatsheet · Maintained by Luo Zhih Jia</p>
    </footer>
  </div>

  <button id="scroll-top-btn" class="scroll-top-btn" type="button" aria-label="回到頁面頂部" title="回到頁面頂部" aria-hidden="true">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M6 14l6-6 6 6" />
    </svg>
  </button>

  <noscript>
    <div class="noscript-banner">這個網站需要啟用 JavaScript 才能使用搜尋、分類與複製功能。</div>
  </noscript>

  <div id="app-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js" defer integrity="sha384-mgWScxWVKP8F7PBbpNp7i/aSb17kN0LcifBpahAplF3Mn0GR4/u1oMpWIm2rD8yY" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="search-core.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
